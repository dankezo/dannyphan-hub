<!doctype html><meta charset="utf-8"><title>m75 bisect</title>
<style>html,body{margin:0;background:#0b0e11;height:100%}canvas{display:block;width:100vw;height:100vh}#tag{position:fixed;left:8px;top:8px;color:#a3e635;font:14px monospace;z-index:9}</style>
<div id="tag">loading</div>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'plain';
const what = q.get('what') || 'hero';
const tag = document.getElementById('tag');
async function main() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: mode === 'full' });
  if (!renderer.capabilities.isWebGL2) { tag.textContent = 'NO WEBGL2'; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 80);
  if (mode === 'full') {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    scene.fog = new THREE.Fog(0x07090c, 15, 32);
    scene.add(new THREE.HemisphereLight(0x9fc8e8, 0x16210f, 0.34));
    const key = new THREE.DirectionalLight(0xcfe6ff, 1.7); key.position.set(1.5, 3.4, -4.6); scene.add(key);
    const fill = new THREE.DirectionalLight(0xbfd4e6, 0.5); fill.position.set(4.5, 2.6, 5.5); scene.add(fill);
    const pt = (c, i, d, x, y, z) => { const L = new THREE.PointLight(c, i, d, 2); L.position.set(x, y, z); scene.add(L); };
    pt(0xe8f1ff, 6, 11, -0.4, 2.75, -0.2); pt(0xffc46b, 2.2, 5.5, -0.7, 2.3, -1.45); pt(0xa3e635, 2.6, 6.5, -3.0, 1.7, 0.6); pt(0xffd9a0, 4, 6.5, 1.2, 1.5, 1.9); pt(0x35d3e0, 1.8, 5.5, 2.45, 1.4, -0.85);
    camera.position.set(3.4, 2.3, 4.4); camera.lookAt(-0.8, 0.85, -0.7);
  } else {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 4); scene.add(key);
    camera.position.set(1.6, 1.3, 2.6); camera.lookAt(0, 0.8, 0);
  }
  const loader = new GLTFLoader();
  const file = what === 'room' ? 'assets/room-lab.glb' : (what === 'neo' ? 'assets/neo-hero.glb' : 'assets/danny-hero-high.glb');
  const g = await new Promise((res, rej) => loader.load(file, res, undefined, rej));
  scene.add(g.scene);
  let mixer = null;
  if (g.animations && g.animations.length) {
    mixer = new THREE.AnimationMixer(g.scene);
    const clip = g.animations.find(c => c.name === 'Typing') || g.animations[0];
    const a = mixer.clipAction(clip); a.play(); mixer.setTime(1.2);
  }
  if (what === 'room') { camera.position.set(3.4, 2.3, 4.4); camera.lookAt(-0.8, 0.85, -0.7); }
  if (what === 'neo') { g.scene.scale.setScalar(2.2); camera.position.set(0.8, 0.7, 1.6); camera.lookAt(0, 0.35, 0); }
  renderer.render(scene, camera);
  tag.textContent = 'mode=' + mode + ' what=' + what + ' RENDERED';
  window.__done = true;
}
main().catch(e => { tag.textContent = 'ERROR: ' + e.message; });
</script>
