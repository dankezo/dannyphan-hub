<!doctype html><meta charset="utf-8"><title>m75 diag v3</title>
<style>html,body{margin:0;background:#0b0e11;height:100%}canvas{display:block;width:100vw;height:100vh}#tag{position:fixed;left:8px;top:8px;color:#a3e635;font:14px monospace;z-index:9}#diag{position:fixed;left:8px;top:34px;color:#e8f1ff;background:rgba(0,0,0,.72);font:12px/1.55 monospace;z-index:9;padding:8px 10px;white-space:pre-wrap;max-width:92vw}</style>
<div id="tag">loading</div><pre id="diag"></pre>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const what = q.get('what') || 'hero';
const tag = document.getElementById('tag');
const diag = document.getElementById('diag');
const lines = [];
const say = (s) => { lines.push(s); diag.textContent = lines.join('\n'); };
async function main() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const gl = renderer.getContext();
  say('WEBGL2=' + renderer.capabilities.isWebGL2);
  try {
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    say('GPU=' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
    say('VENDOR=' + (ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)));
  } catch (e) { say('GPU=ERR ' + e.message); }
  say('MAXTEX=' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 80);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 4); scene.add(key);
  camera.position.set(1.6, 1.3, 2.6); camera.lookAt(0, 0.8, 0);
  const loader = new GLTFLoader();
  const file = what === 'room' ? 'assets/room-lab.glb' : (what === 'neo' ? 'assets/neo-hero.glb' : 'assets/danny-hero-high.glb');
  const g = await new Promise((res, rej) => loader.load(file, res, undefined, rej));
  scene.add(g.scene);
  const mats = [];
  g.scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (!mats.includes(m)) mats.push(m); }); });
  say('MATS=' + mats.length + ' WITHMAP=' + mats.filter(m => m.map).length);
  mats.slice(0, 8).forEach((m, i) => {
    if (!m.map) { say('M' + i + ' ' + (m.name || '?') + ' MAP=NONE color=' + (m.color ? m.color.getHexString() : '?')); return; }
    const img = m.map.image;
    say('M' + i + ' ' + (m.name || '?') + ' MAP=YES img=' + (img ? (img.constructor ? img.constructor.name : typeof img) : 'NULL') + ' ' + (img ? (img.width || img.naturalWidth || '?') + 'x' + (img.height || img.naturalHeight || '?') : '') + ' cs=' + m.map.colorSpace);
  });
  /* sample the first map image through a plain 2D canvas and report real pixels */
  const first = mats.find(m => m.map && m.map.image);
  if (first) {
    try {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(first.map.image, 0, 0, 64, 64);
      const d = cx.getImageData(0, 0, 64, 64).data;
      let r = 0, gg = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++; }
      say('TEX2D_MEAN=' + Math.round(r / n) + ',' + Math.round(gg / n) + ',' + Math.round(b / n));
      say('TEX2D_CENTER=' + d[(32 * 64 + 32) * 4] + ',' + d[(32 * 64 + 32) * 4 + 1] + ',' + d[(32 * 64 + 32) * 4 + 2]);
    } catch (e) { say('TEX2D=ERR ' + e.name + ': ' + e.message); }
  } else say('TEX2D=NO IMAGE ON ANY MATERIAL');
  let mixer = null;
  if (g.animations && g.animations.length) {
    mixer = new THREE.AnimationMixer(g.scene);
    const clip = g.animations.find(c => c.name === 'Typing') || g.animations[0];
    const a = mixer.clipAction(clip); a.play(); mixer.setTime(1.2);
  }
  if (what === 'neo') { g.scene.scale.setScalar(2.2); camera.position.set(0.8, 0.7, 1.6); camera.lookAt(0, 0.35, 0); }
  if (what === 'room') { camera.position.set(3.4, 2.3, 4.4); camera.lookAt(-0.8, 0.85, -0.7); }
  renderer.render(scene, camera);
  say('GLERR_AFTER_RENDER=' + gl.getError());
  /* read back the rendered frame center in the same task */
  try {
    const rc = document.createElement('canvas'); rc.width = renderer.domElement.width; rc.height = renderer.domElement.height;
    const rx = rc.getContext('2d', { willReadFrequently: true });
    rx.drawImage(renderer.domElement, 0, 0);
    const px = rx.getImageData(Math.floor(rc.width / 2), Math.floor(rc.height / 2), 1, 1).data;
    say('FRAME_CENTER=' + px[0] + ',' + px[1] + ',' + px[2]);
    const px2 = rx.getImageData(Math.floor(rc.width * 0.5), Math.floor(rc.height * 0.35), 1, 1).data;
    say('FRAME_UPPER=' + px2[0] + ',' + px2[1] + ',' + px2[2]);
  } catch (e) { say('FRAME=ERR ' + e.name + ': ' + e.message); }
  tag.textContent = 'diag v3 what=' + what + ' RENDERED';
  window.__done = true;
}
main().catch(e => { tag.textContent = 'ERROR: ' + e.message; say('LOAD=ERR ' + e.message); });
</script>
