<!doctype html><meta charset="utf-8"><title>m75 diag v5 heal check</title>
<style>html,body{margin:0;background:#0b0e11;height:100%}canvas{display:block;width:100vw;height:100vh}#tag{position:fixed;left:8px;top:8px;color:#a3e635;font:14px monospace;z-index:9}#diag{position:fixed;left:8px;top:34px;color:#e8f1ff;background:rgba(0,0,0,.72);font:12px/1.55 monospace;z-index:9;padding:8px 10px;white-space:pre-wrap;max-width:92vw}</style>
<div id="tag">loading</div><pre id="diag"></pre>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js","three/addons/":"./assets/vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const tag = document.getElementById('tag');
const diag = document.getElementById('diag');
const lines = [];
const say = (s) => { lines.push(s); diag.textContent = lines.join('\n'); };
function collectMats(scene) {
  const mats = new Set();
  scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.add(m)); });
  return [...mats];
}
function countMaps(scene) { const m = collectMats(scene); return m.filter(x => x.map).length + '/' + m.length; }

/* Manual texture heal: rebuild every texture straight from the GLB bytes
   (Blob -> createImageBitmap, no object URLs anywhere) and re-assign any
   slot the loader dropped. Healthy loads are left untouched. */
async function healTextures(gltf, ab) {
  const dv = new DataView(ab);
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(new Uint8Array(ab, 20, jsonLen)));
  const binStart = 20 + jsonLen + 8;
  const built = [];
  for (let ti = 0; ti < (json.textures || []).length; ti++) {
    const t = json.textures[ti];
    const img = json.images[t.source];
    const bv = json.bufferViews[img.bufferView];
    const bytes = new Uint8Array(ab, binStart + (bv.byteOffset || 0), bv.byteLength);
    const bmp = await createImageBitmap(new Blob([bytes], { type: img.mimeType || 'image/png' }), { premultiplyAlpha: 'none' });
    const tex = new THREE.Texture(bmp);
    tex.flipY = false;
    tex.needsUpdate = true;
    const s = (json.samplers && json.samplers[t.sampler]) || {};
    tex.magFilter = s.magFilter !== undefined ? s.magFilter : THREE.LinearFilter;
    tex.minFilter = s.minFilter !== undefined ? s.minFilter : THREE.LinearMipmapLinearFilter;
    tex.wrapS = s.wrapS !== undefined ? s.wrapS : THREE.RepeatWrapping;
    tex.wrapT = s.wrapT !== undefined ? s.wrapT : THREE.RepeatWrapping;
    built[ti] = tex;
  }
  const applyInfo = (mat, prop, info, isColor) => {
    if (!info || mat[prop]) return;
    let tex = built[info.index];
    if (!tex) return;
    tex = tex.clone();
    tex.needsUpdate = true;
    tex.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    const tr = info.extensions && info.extensions.KHR_texture_transform;
    if (tr) {
      if (tr.offset) tex.offset.set(tr.offset[0], tr.offset[1]);
      if (tr.repeat) tex.repeat.set(tr.repeat[0], tr.repeat[1]);
      if (tr.rotation) tex.rotation = tr.rotation;
      if (tr.texCoord !== undefined) tex.channel = tr.texCoord;
    } else if (info.texCoord) tex.channel = info.texCoord;
    mat[prop] = tex;
  };
  let healed = 0;
  gltf.parser.associations.forEach((assoc, mat) => {
    if (!assoc || assoc.materials === undefined) return;
    const def = json.materials[assoc.materials];
    if (!def) return;
    const pbr = def.pbrMetallicRoughness || {};
    const before = !!mat.map;
    applyInfo(mat, 'map', pbr.baseColorTexture, true);
    applyInfo(mat, 'roughnessMap', pbr.roughnessTexture, false);
    applyInfo(mat, 'metalnessMap', pbr.metallicTexture, false);
    applyInfo(mat, 'normalMap', def.normalTexture, false);
    applyInfo(mat, 'emissiveMap', def.emissiveTexture, true);
    applyInfo(mat, 'aoMap', def.occlusionTexture, false);
    if (!before && mat.map) healed++;
    mat.needsUpdate = true;
  });
  return healed;
}

async function main() {
  say('UA=' + navigator.userAgent);
  const ab = await (await fetch('assets/danny-hero-high.glb')).arrayBuffer();
  say('GLB_BYTES=' + ab.byteLength);
  const loader = new GLTFLoader();
  const gltf = await new Promise((res, rej) => loader.parse(ab.slice(0), '', res, rej));
  say('A_WITHMAP=' + countMaps(gltf.scene));
  if (q.get('forceheal')) {
    collectMats(gltf.scene).forEach(m => { m.map = null; m.normalMap = null; m.roughnessMap = null; m.metalnessMap = null; m.emissiveMap = null; m.aoMap = null; m.needsUpdate = true; });
    say('FORCED_STRIP maps=' + countMaps(gltf.scene));
  }
  const missing = collectMats(gltf.scene).some(m => !m.map);
  if (missing) {
    try {
      const healed = await healTextures(gltf, ab);
      say('HEALED=' + healed + ' WITHMAP_NOW=' + countMaps(gltf.scene));
    } catch (e) { say('HEAL=ERR ' + e.name + ': ' + e.message); }
  } else say('HEAL=NOT NEEDED');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const root = new THREE.Scene();
  root.add(gltf.scene);
  root.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 4); root.add(key);
  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 80);
  camera.position.set(1.6, 1.3, 2.6); camera.lookAt(0, 0.8, 0);
  if (gltf.animations && gltf.animations.length) {
    const mixer = new THREE.AnimationMixer(gltf.scene);
    const clip = gltf.animations.find(c => c.name === 'Typing') || gltf.animations[0];
    const a = mixer.clipAction(clip); a.play(); mixer.setTime(1.2);
  }
  renderer.render(root, camera);
  try {
    const rc = document.createElement('canvas'); rc.width = renderer.domElement.width; rc.height = renderer.domElement.height;
    const rx = rc.getContext('2d', { willReadFrequently: true });
    rx.drawImage(renderer.domElement, 0, 0);
    const px = rx.getImageData(Math.floor(rc.width / 2), Math.floor(rc.height / 2), 1, 1).data;
    say('FRAME_CENTER=' + px[0] + ',' + px[1] + ',' + px[2]);
  } catch (e) { say('FRAME=ERR ' + e.name + ': ' + e.message); }
  tag.textContent = 'diag v5 RENDERED';
  window.__done = true;
}
main().catch(e => { tag.textContent = 'ERROR: ' + e.message; say('FATAL=ERR ' + e.name + ': ' + e.message); });
</script>
